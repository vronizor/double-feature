<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Double Feature</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- icon.svg is the tab favicon: logo.svg's two tickets without the
         perforations and with less tilt, because the dashes smear into grey
         at 16 px. The touch icon is logo.svg rendered square at 180 px; iOS
         rounds the corners itself and would fill transparent ones black. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="loading">Loading…</div>
    </div>

    <footer class="credit">
      <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
      <span class="credit-version" id="app-version"></span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
